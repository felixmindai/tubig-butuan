name: Archive sources to the Wayback Machine

# Runs whenever a data file changes on main, plus once a week, and on demand.
# Saves a snapshot of every source URL and commits the archive links back.
# Actions are pinned to full commit SHAs, as the repository policy requires.
on:
  push:
    branches: [main]
    paths: ["data/**.json"]
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC = 11:17 AM in Butuan
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-sources
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Archive source URLs
        run: python3 tools/archive-sources.py
      - name: Commit archive links
        run: |
          git config user.name "tubig-butuan-archiver"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No archive links changed."
          else
            git commit -m "chore: refresh Wayback archive links for sources"
            git push
          fi
