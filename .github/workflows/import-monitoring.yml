name: Import BCWD tanker monitoring

# Pulls BCWD's hourly tanker monitoring sheet into data/schedule.json every
# 30 minutes during rationing hours (6 AM to 8 PM Butuan time = 22:00-12:00 UTC),
# so the site shows scheduled and actual stops without anyone retyping posters.
on:
  schedule:
    - cron: "*/30 22-23 * * *"
    - cron: "*/30 0-12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-monitoring
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import monitoring sheet
        run: python tools/import-bcwd-monitoring.py
      - name: Commit schedule
        run: |
          git config user.name "tubig-butuan-importer"
          git config user.email "actions@users.noreply.github.com"
          git add data/schedule.json data/monitoring-index.json
          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "chore: import BCWD tanker monitoring ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          fi
